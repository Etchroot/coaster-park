<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코스터 데이터 파크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2433; --ink2:#4a5468; --paper:#fffdf5; --line:#1d2433;
  --sun:#ffd23f; --sky:#bfe6ff; --pop:#ff5d5d; --mint:#2fd17a;
  --shadow:0 4px 0 rgba(29,36,51,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font:14px/1.55 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400}
.card{background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* 상단 타이틀 + 기록 */
#top{position:fixed;left:16px;top:16px;right:16px;display:flex;gap:12px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
#brand{pointer-events:auto;padding:10px 16px;background:var(--sun)}
#brand h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.5px}
#brand p{margin:2px 0 0;font-size:12px;color:var(--ink2)}
.rec{pointer-events:auto;padding:8px 14px;min-width:150px}
.rec b{display:block;font-size:22px;line-height:1.15}
.rec span{font-size:11.5px;color:var(--ink2)}
.rec small{display:block;font-size:11px;color:var(--ink2)}

/* 왼쪽 존 목록 */
#zones{position:fixed;left:16px;top:92px;width:230px;max-height:calc(100% - 180px);overflow:auto;padding:10px}
/* 조작법 */
#help{position:fixed;left:16px;bottom:16px;width:230px;padding:6px 8px}
#help-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 6px;border:0;background:transparent;font:16px Jua,sans-serif;color:inherit;cursor:pointer;border-radius:8px}
#help-toggle:hover{background:#fff3c4}
#help-toggle .arrow{font-size:11px;color:var(--ink2);transition:transform .2s}
#help.open #help-toggle .arrow{transform:rotate(180deg)}
#help .body{display:none;padding:4px 4px 2px}
#help.open .body{display:block}
body.help-open #zones{max-height:calc(100% - 430px)}
#help .row{display:grid;grid-template-columns:30px 1fr;column-gap:8px;align-items:center;font-size:11.5px;padding:3px 0;border-top:1px dashed #d6dbe5}
#help .row b{font-weight:700;display:block;line-height:1.25}
#help .row span{color:var(--ink2);grid-column:2}
#help .m{grid-row:span 2;width:18px;height:26px;border:2px solid var(--line);border-radius:9px 9px 10px 10px;position:relative;background:#fff;justify-self:center}
#help .m::before{content:"";position:absolute;top:2px;width:5px;height:9px;border-radius:3px;background:var(--pop)}
#help .m.l::before{left:2px}
#help .m.r::before{right:2px}
#help .m.w::before{left:50%;transform:translateX(-50%);width:4px;background:var(--mint)}
#help .k{grid-row:span 2;font:bold 10px/1 Jua,sans-serif;border:2px solid var(--line);border-radius:6px;padding:4px 3px;background:#fff;justify-self:center;font-style:normal}

/* 1인칭 탑승 */
#ride{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:none;gap:10px;align-items:center;z-index:6}
body.riding #ride{display:flex}
body.riding #zones,body.riding #panel,body.riding #help,body.riding #ctl,body.riding #top{display:none}
#ride .rbox{padding:6px 14px;min-width:130px}
#ride .rbox span{font-size:11px;color:var(--ink2);display:block}
#ride .rbox b{font-size:22px;line-height:1.1}
#ride-exit{font:18px Jua,sans-serif;padding:8px 16px;border:3px solid var(--line);border-radius:12px;background:var(--pop);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ridebtn{display:block;width:100%;margin:10px 0 4px;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--pop);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ridebtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#zones h2{margin:2px 6px 8px;font-size:17px}
.zbtn{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 6px;padding:7px 10px;border:2px solid transparent;
  border-radius:10px;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:left}
.zbtn:hover{background:#fff3c4}
.zbtn.on{border-color:var(--line);background:#fff3c4}
.zbtn i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);flex:none}
.zbtn em{margin-left:auto;font-style:normal;color:var(--ink2);font-size:12px}

/* 오른쪽 상세 */
#panel{position:fixed;right:16px;top:92px;width:360px;max-height:calc(100% - 180px);overflow:auto;padding:16px 18px}
#panel .chip{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid var(--line);font-size:12px;color:#fff}
#panel h2{margin:8px 0 0;font-size:28px;line-height:1.15}
#panel .en{color:var(--ink2);font-size:12.5px}
#panel .headline{margin:10px 0 12px;padding:10px 12px;background:#fff3c4;border-radius:10px;border:2px dashed var(--line);font-weight:800;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.kpi span{font-size:11.5px;color:var(--ink2)}
.kpi b{display:block;font-size:19px;line-height:1.2}
.kpi small{font-size:11px;color:var(--ink2)}
#panel h3{margin:16px 0 6px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:4px 4px;border-bottom:1px dashed #c9cfda;text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.note{margin-top:14px;font-size:11.5px;color:var(--ink2);border-top:2px solid var(--line);padding-top:8px}
.intro p{margin:6px 0}

/* 아래 컨트롤 */
#ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 10px}
#ctl button{font:18px Jua,sans-serif;padding:6px 14px;border:3px solid var(--line);border-radius:12px;background:var(--sun);cursor:pointer;box-shadow:0 3px 0 var(--line)}
#ctl button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#ctl .hint{font-size:12px;color:var(--ink2);padding:0 6px}

#tip{position:fixed;pointer-events:none;padding:6px 10px;background:var(--ink);color:#fff;border-radius:8px;font-size:12.5px;
  transform:translate(14px,14px);display:none;max-width:280px;z-index:5}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);font:28px Jua,sans-serif;z-index:9}

@media (max-width:900px){
  #zones,#help{display:none}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:84px;max-height:42%}
  #ctl .hint{display:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">놀이공원 짓는 중… 🎢</div>

<div id="top">
  <div id="brand" class="card"><h1 class="jua">🎢 코스터 데이터 파크</h1><p id="src"></p></div>
</div>

<nav id="zones" class="card"><h2 class="jua">🗺️ 존 안내도</h2><div id="zlist"></div></nav>
<aside id="panel" class="card"></aside>

<div id="help" class="card">
  <button id="help-toggle" class="jua" aria-expanded="false">🖱️ 조작법 <span class="arrow">▲</span></button>
  <div class="body">
  <div class="row"><i class="m l"></i><b>왼쪽 버튼 드래그</b><span>화면 회전</span></div>
  <div class="row"><i class="m r"></i><b>오른쪽 버튼 드래그</b><span>화면 이동</span></div>
  <div class="row"><i class="m w"></i><b>휠 굴리기</b><span>확대 · 축소</span></div>
  <div class="row"><i class="m l"></i><b>왼쪽 클릭 (존 · 막대)</b><span>선택 · 자세히</span></div>
  <div class="row"><i class="k">← →</i><b>방향키</b><span>이전 · 다음 존</span></div>
  <div class="row"><i class="k">🎢</i><b>타는 법</b><span>존 선택 → 패널의 <b>🎢 1인칭으로 타보기</b></span></div>
  <div class="row"><i class="k">Esc</i><b>내리는 법</b><span>Esc 또는 화면 위 <b>✕ 내리기</b></span></div>
  <div class="row"><i class="k">🔊</i><b>아래 버튼들</b><span>낮/밤 · 소리 · 품질은 <b>현재 상태</b>를 보여줘요. 누르면 전환</span></div>
  </div>
</div>

<div id="ctl" class="card">
  <button id="prev" title="이전 존 (←)">◀</button>
  <button id="home">🏠 전체 보기</button>
  <button id="next" title="다음 존 (→)">▶</button>
  <button id="pause">⏸ 열차</button>
  <button id="night" title="지금 낮 — 클릭하면 밤으로">☀️ 낮</button>
  <button id="sound" title="지금 소리 꺼짐 — 클릭하면 켜짐">🔈 소리</button>
  <button id="quality" title="지금 품질 — 클릭하면 전환">⚡ 빠름</button>
</div>

<div id="ride">
  <div class="card rbox"><span>🎢 탑승 중</span><b class="jua" id="ride-name"></b></div>
  <div class="card rbox"><span>지금 속도</span><b class="jua" id="ride-speed"></b></div>
  <button id="ride-exit" class="jua">✕ 내리기 (Esc)</button>
</div>
<div id="tip"></div>

<script src="data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const D = window.PARK_DATA;
try { await document.fonts.load('40px Jua'); } catch (e) {}

/* ---------- 숫자 형식 ---------- */
const fmt = (v, d = 0) => v == null ? '–' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: d });
const secTxt = s => s == null ? '–' : `${Math.floor(s / 60)}분 ${String(Math.round(s % 60)).padStart(2, '0')}초`;

/* ---------- 기본 장면 ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fd2f7');
scene.fog = new THREE.Fog('#cfe9fb', 180, 420);
// 환경광: HDRI 가 로드되기 전까지는 RoomEnvironment 로 임시
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
/* HDRI 하늘 (Poly Haven · CC0): 배경 + 환경광 둘 다 — 실제 하늘빛이 금속·차체에 비침 */
const HDRI = { day: null, night: null };
const rgbe = new RGBELoader();
function loadHDRI(key, url) {
  rgbe.load(url, tex => {
    tex.mapping = THREE.EquirectangularReflectionMapping;
    HDRI[key] = { bg: tex, env: pmrem.fromEquirectangular(tex).texture };
    if ((key === 'night') === night) applySky();
  }, undefined, e => console.warn('HDRI 로드 실패', url, e));
}
function applySky() {
  const h = night ? HDRI.night : HDRI.day;
  if (!h) return;                                   // 아직 없으면 그라데이션 돔 유지
  scene.background = h.bg; scene.environment = h.env;
  scene.backgroundBlurriness = 0.02; scene.backgroundIntensity = night ? 0.28 : 1.0; // 밤 HDRI 는 지평선 광원이 강해서 줄임
  scene.environmentIntensity = night ? 0.35 : 0.9;
  sky.visible = false;
}
loadHDRI('day', 'asset/hdri/day.hdr');
loadHDRI('night', 'asset/hdri/night.hdr');
// 하늘: 낮(파랑→뿌연 지평선) · 밤(남색→보라 네온 지평선)
function skyTex(stops, stars) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const ctx = c.getContext('2d'); const gr = ctx.createLinearGradient(0, 0, 0, 512);
  stops.forEach(([k, col]) => gr.addColorStop(k, col));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, 256, 512);
  if (stars) { let sd = 11; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 260; i++) { const a = 0.4 + r() * 0.6; ctx.fillStyle = `rgba(255,255,255,${a})`; const x = r() * 256, y = r() * 230, w = 0.6 + r() * 1.4; ctx.fillRect(x, y, w, w); } }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const SKY_DAY = skyTex([[0, '#5aa9e6'], [0.45, '#9fd2f7'], [0.62, '#dff1fb'], [1, '#eaf5fb']]);
const SKY_NIGHT = skyTex([[0, '#070b1f'], [0.4, '#141a3f'], [0.56, '#3b2a6b'], [0.64, '#8a3f8f'], [0.75, '#2a2050'], [1, '#141a3f']], true);
const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 24, 16), new THREE.MeshBasicMaterial({ map: SKY_DAY, side: THREE.BackSide, fog: false }));
scene.add(sky);

const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 1600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 12;
controls.maxDistance = 260;

const hemi = new THREE.HemisphereLight('#dff1ff', '#5f9e46', 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4dd', 2.2);
sun.position.set(60, 110, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 90, bottom: -90, near: 10, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3;
scene.add(sun);

const matCache = new Map();
function mat(color, extra = {}) {
  const k = color + JSON.stringify(extra);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, metalness: 0.08, ...extra }));
  return matCache.get(k);
}
function mesh(geo, color, x = 0, y = 0, z = 0, extra) {
  if (geo.groups && geo.groups.length > 1) geo.clearGroups(); // Box 는 면마다 그룹 6개 = 드로우콜 6번 → 1번으로
  const m = new THREE.Mesh(geo, mat(color, extra));
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const BOX = new THREE.BoxGeometry(1, 1, 1);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
const RBOX = (w, h, d, r = 0.08) => { const g = new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2)); g.clearGroups(); return g; };
const CAP = (r, len) => new THREE.CapsuleGeometry(r, Math.max(0.001, len), 2, 7);

/* 절차적 텍스처: 잔디 · 보도블록 */
function noiseTex(size, base, spots, { repeat = 1, blur = 0 } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0, 0, size, size);
  let seed = 3;
  const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const [col, n, rad] of spots) {
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) { const x = r() * size, y = r() * size, w = rad * (0.5 + r()); ctx.beginPath(); ctx.ellipse(x, y, w, w * (0.6 + r() * 0.8), r() * 3, 0, 7); ctx.fill(); }
  }
  if (blur) { ctx.filter = `blur(${blur}px)`; ctx.drawImage(c, 0, 0); ctx.filter = 'none'; }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8;
  return t;
}
function paverTex() {
  const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d9cfb4'; ctx.fillRect(0, 0, size, size);
  const cols = ['#efe4c6', '#e6dabb', '#f3e9cd', '#e2d4b0'];
  const bw = 32, bh = 16; let k = 0;
  for (let y = 0; y < size; y += bh) for (let x = (y / bh % 2) * bw / 2 - bw; x < size; x += bw) {
    ctx.fillStyle = cols[k++ % 4]; ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
const GRASS = noiseTex(512, '#7fc565', [['#6cb355', 1400, 5], ['#93d474', 900, 4], ['#5fa34b', 500, 3], ['#a8df88', 250, 2]], { blur: 0.6 });
GRASS.repeat.set(60, 40);
const PAVER = paverTex();
function brushedTex() {
  const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#8c8c8c'; ctx.fillRect(0, 0, size, size);
  let sd = 5; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 2600; i++) { ctx.strokeStyle = `rgba(${r() < 0.5 ? 40 : 230},${r() < 0.5 ? 40 : 230},${r() < 0.5 ? 40 : 230},${0.05 + r() * 0.12})`; ctx.lineWidth = 0.5 + r() * 1.2; const y = r() * size; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y + (r() - 0.5) * 3); ctx.stroke(); }
  for (let i = 0; i < 60; i++) { ctx.strokeStyle = `rgba(255,255,255,${0.15 + r() * 0.3})`; ctx.lineWidth = 0.6; const x = r() * size, y = r() * size; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (r() - 0.5) * 40, y + (r() - 0.5) * 10); ctx.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 40); return t;
}
const BRUSHED = brushedTex();
function woodTex() {
  const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#b57a3c'; ctx.fillRect(0, 0, size, size);
  let sd = 9; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) { ctx.strokeStyle = `rgba(${60 + r() * 40},${30 + r() * 25},${10 + r() * 15},${0.12 + r() * 0.25})`; ctx.lineWidth = 0.6 + r() * 2.2; const y = r() * size; ctx.beginPath(); ctx.moveTo(0, y); for (let x = 0; x <= size; x += 16) ctx.lineTo(x, y + Math.sin(x / 23 + i) * 2.5); ctx.stroke(); }
  for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(70,40,15,0.35)'; ctx.beginPath(); ctx.ellipse(r() * size, r() * size, 4 + r() * 6, 2 + r() * 3, r() * 3, 0, 7); ctx.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const WOODTEX = woodTex();

const WOOD_DARK = new THREE.MeshPhysicalMaterial({ color: '#9c6a3c', map: WOODTEX, roughness: 0.9, metalness: 0 });

/* 같은 모양 여러 개 → InstancedMesh 하나 */
class Inst {
  constructor(geo, color) { this.geo = geo; this.color = color; this.list = []; }
  add(x, y, z, sx, sy, sz, rotY = 0) {
    const o = new THREE.Object3D();
    o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.rotation.y = rotY; o.updateMatrix();
    this.list.push(o.matrix.clone());
  }
  build() {
    if (this.geo.groups && this.geo.groups.length > 1) this.geo.clearGroups();
    const im = new THREE.InstancedMesh(this.geo, mat(this.color), Math.max(1, this.list.length));
    this.list.forEach((m, i) => im.setMatrixAt(i, m));
    im.count = this.list.length;
    im.castShadow = true; im.receiveShadow = true;
    return im;
  }
}

function textCanvas(lines, { size = 44, color = '#1d2433', bg = 'rgba(255,253,245,.95)', border = '#1d2433', pad = 18 } = {}) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const fonts = lines.map((_, i) => `${i === 0 ? size : Math.round(size * 0.6)}px Jua, "Noto Sans KR", sans-serif`);
  const hs = lines.map((_, i) => (i === 0 ? size : size * 0.6) * 1.22);
  let w = 0;
  lines.forEach((l, i) => { ctx.font = fonts[i]; w = Math.max(w, ctx.measureText(l).width); });
  c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(hs.reduce((a, b) => a + b, 0) + pad * 1.4);
  if (bg) {
    ctx.fillStyle = bg; ctx.strokeStyle = border; ctx.lineWidth = border ? 6 : 0;
    ctx.beginPath(); ctx.roundRect(3, 3, c.width - 6, c.height - 6, 18); ctx.fill(); if (border) ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = pad * 0.7;
  lines.forEach((l, i) => {
    ctx.font = fonts[i]; ctx.fillStyle = i === 0 ? color : '#4a5468';
    ctx.fillText(l, c.width / 2, y + hs[i] / 2); y += hs[i];
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return { tex, aspect: c.width / c.height };
}

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const SKIN = ['#ffd7b0', '#e8b48a', '#c68b5e', '#8d5a3b'];
const SHIRTS = ['#ff5d5d', '#4f8cff', '#ffd23f', '#2fd17a', '#ff5fb0', '#7c5cff', '#ffffff', '#1d2433'];

/* 곡선을 따라가는 좌표계: T(앞) · N(위) · B(옆).
   '위' 방향을 조금씩만 돌려 가며 옮겨서(평행 이동) 루프·코르크스크루에서도 레일이 꼬이지 않아요. */
function trackFrames(curve, n, closed) {
  const P = [], T = [], N = [], B = [];
  for (let i = 0; i <= n; i++) {
    const u = closed ? (i % n) / n : i / n;
    P.push(curve.getPointAt(u));
    T.push(curve.getTangentAt(u).normalize());
  }
  const up = V3(0, 1, 0);
  N.push(up.clone().addScaledVector(T[0], -T[0].dot(up)).normalize());
  for (let i = 1; i <= n; i++) {
    const v = N[i - 1].clone().addScaledVector(T[i], -T[i].dot(N[i - 1]));
    N.push(v.lengthSq() < 1e-8 ? N[i - 1].clone() : v.normalize());
  }
  if (closed) { // 한 바퀴 돌고 어긋난 각도를 전체에 나눠서 보정
    const th = Math.atan2(N[n].clone().cross(N[0]).dot(T[0]), N[n].dot(N[0]));
    for (let i = 1; i <= n; i++) N[i].applyAxisAngle(T[i], th * i / n);
  }
  for (let i = 0; i <= n; i++) B.push(T[i].clone().cross(N[i]).normalize());
  return { P, T, N, B, n, closed };
}

function frameAt(F, u, P, N, T) {
  const f = Math.min(F.n - 1e-6, Math.max(0, u * F.n));
  const i = Math.floor(f), a = f - i;
  P.lerpVectors(F.P[i], F.P[i + 1], a);
  N.lerpVectors(F.N[i], F.N[i + 1], a).normalize();
  T.lerpVectors(F.T[i], F.T[i + 1], a).normalize();
}

function offsetTube(F, side, upOff, r, material, segs = 8) {
  const m = F.closed ? F.n : F.n + 1;
  const pts = [];
  for (let i = 0; i < m; i++) pts.push(F.P[i].clone().addScaledVector(F.B[i], side).addScaledVector(F.N[i], upOff));
  if (r >= 0.08) collAdd(r > 0.12 ? '등뼈' : '레일', r, pts.filter((_, i) => i % 2 === 0));
  const c = new THREE.CatmullRomCurve3(pts, F.closed);
  const me = new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(24, Math.round(F.n * 0.8)), r, segs, F.closed), typeof material === 'string' ? railMat(material) : material);
  me.castShadow = true; me.receiveShadow = true;
  return me;
}

/* InstancedMesh에 행렬을 직접 넣는 버전 */
Inst.prototype.addM = function (m) { this.list.push(m.clone()); };
const _m = new THREE.Matrix4();
function basisM(x, y, z, pos, sx, sy, sz) {
  _m.makeBasis(x, y, z);
  _m.scale(V3(sx, sy, sz));
  _m.setPosition(pos);
  return _m;
}
/* 탑승 테스터용 충돌 점구름: {name, pts:[x,y,z,...], r} (모형 좌표계) */
let COLL = null;
function collAdd(name, r, pts) { if (!COLL) return; let c = COLL.find(x => x.name === name && x.r === r); if (!c) { c = { name, r, pts: [] }; COLL.push(c); } for (const p of pts) c.pts.push(p.x, p.y, p.z); }
/* a→b 를 잇는 막대 (기둥·버팀목) */
function beam(inst, a, b, thick) {
  const d = b.clone().sub(a), len = d.length();
  if (len < 1e-3) return;
  if (COLL) { const n = Math.max(1, Math.ceil(len / 0.5)), ps = []; for (let i = 0; i <= n; i++) ps.push(a.clone().lerp(b, i / n)); collAdd(thick > 0.1 ? '기둥' : '버팀목', thick / 2, ps); }
  const y = d.normalize();
  const x = Math.abs(y.y) > 0.9 ? V3(1, 0, 0) : V3(0, 1, 0).cross(y).normalize();
  const z = x.clone().cross(y).normalize();
  x.copy(y.clone().cross(z));
  inst.addM(basisM(x, y, z, a.clone().add(b).multiplyScalar(0.5), thick, len, thick));
}

/* 제어점 코너 깎기(Chaikin): 뾰족한 V자 골짜기·꼭대기를 둥근 곡선으로 */
function chaikin(pts, closed, iters = 1) {
  for (; iters > 0; iters--) {
    const n = pts.length, out = [];
    if (!closed) out.push(pts[0]);
    for (let i = 0; i < (closed ? n : n - 1); i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      out.push(a.clone().lerp(b, 0.25), a.clone().lerp(b, 0.75));
    }
    if (!closed) out.push(pts[n - 1]);
    pts = out;
  }
  return pts;
}

  const foot = new Inst(BOX, '#c3c7cf');
  const step = Math.max(1, Math.round(F.n / (L / (wood ? 1.1 : 2.2))));
  const nearOther = (i, cx, cz, yTop, rad) => { for (let k = 0; k < F.n; k += 2) { const di = Math.abs(k - i); if (Math.min(di, F.n - di) < 25) continue; const q = F.P[k]; if (q.y < yTop + 0.5 && Math.hypot(q.x - cx, q.z - cz) < rad) return true; } return false; };
  for (let i = 0; i < F.n; i += step) {
    const p = F.P[i], N = F.N[i];
    if (p.y < 0.9 || (o.skip && o.skip(p))) continue;
    const th = F.T[i].clone(); th.y = 0;
    if (th.lengthSq() < 1e-4) continue;
    th.normalize();
    const side = V3(-th.z, 0, th.x); // 수평 옆 방향
    if (o.hang) {
      if (N.y < 0.5) continue;
      // T자 받침: 옆 기둥 → 위 팔 → 레일 위로 내려오는 짧은 막대
      const top = p.y + 1.1;
      { const i0 = Math.max(0, i - 10), i1 = Math.min(F.n, i + 10); const turn = F.T[i1].clone().sub(F.T[i0]); if (turn.dot(side) > 0) side.negate(); } // 커브 바깥쪽
      const col = V3(p.x, 0, p.z).addScaledVector(side, 3.0);
      if (nearOther(i, col.x, col.z, top, 2.4)) continue;
      beam(sup, col, V3(col.x, top, col.z), 0.16);
      beam(brace, V3(col.x, top, col.z), V3(p.x, top, p.z).addScaledVector(side, -0.3), 0.2);
      beam(brace, V3(p.x, top, p.z), p.clone().addScaledVector(N, 0.12), 0.12);
      foot.add(col.x, 0.15, col.z, 0.8, 0.3, 0.8);
    } else if (wood) {
      if (N.y < 0.6) continue;
      const h = p.y - 0.2;
      const a0 = V3(p.x, 0, p.z).addScaledVector(side, 0.8), b0 = V3(p.x, 0, p.z).addScaledVector(side, -0.8);
      if (nearOther(i, p.x, p.z, h, 1.7)) continue;
      beam(sup, a0, V3(a0.x, h, a0.z), 0.16);
      beam(sup, b0, V3(b0.x, h, b0.z), 0.16);
      for (let y = 0.2; y + 1.3 < h; y += 1.3) {
        beam(brace, V3(a0.x, y, a0.z), V3(b0.x, y + 1.3, b0.z), 0.08); // 엑스자 버팀
        beam(brace, V3(b0.x, y, b0.z), V3(a0.x, y + 1.3, a0.z), 0.08);
        beam(brace, V3(a0.x, y + 1.3, a0.z), V3(b0.x, y + 1.3, b0.z), 0.1);
      }
    } else {
      if (N.y < 0.55) continue;
      const base = p.clone().addScaledVector(N, -0.4);
      if (nearOther(i, base.x, base.z, p.y - 0.5, 1.3)) continue;
      beam(sup, V3(base.x, 0, base.z), base, p.y > 7 ? 0.2 : 0.14);
      foot.add(base.x, 0.15, base.z, 0.7, 0.3, 0.7);
    }
  }
  for (const [s, nm] of [[sup, '기둥'], [brace, '버팀목'], [foot, '발판']]) if (s.list.length) { const m = s.build(); if (!wood && !o.supportColor) m.material = STEEL; if (wood) m.material = nm === '기둥' ? WOOD : WOOD_DARK; m.userData.part = nm; g.add(m); }
  if (o.extra) o.extra(g, F);

  // 승강장: 레일이 바로 서 있는 가장 낮은 곳
  if (o.station !== false) {
    const K = 11; // 앞뒤 2.2 단위 (프레임 간격 0.2)
    const wrap = i => closed ? ((i % F.n) + F.n) % F.n : Math.min(F.n - 1, Math.max(0, i));
    let best = -1, bs = 1e9;
    for (let i = 0; i < F.n; i += 2) {
      if (F.N[i].y < 0.97) continue;
      if (o.stationRange && (i / F.n < o.stationRange[0] || i / F.n > o.stationRange[1])) continue;
      const bend = 2 - F.T[wrap(i - K)].dot(F.T[wrap(i + K)]) - F.T[wrap(i - 16)].dot(F.T[wrap(i + 16)]); // 0 = 앞뒤 3.2 까지 직선
      let crowd = 0;                                            // 옆에 다른 트랙(스위치백 옆 줄 등)이 지나가면 기둥이 그쪽 머리에 닿으니 피함
      for (let k = 0; k < F.n; k += 3) { const di = Math.abs(k - i); if (Math.min(di, F.n - di) < 30) continue; const d = F.P[k].distanceTo(F.P[i]); if (d < 3.6) crowd = Math.max(crowd, 3.6 - d); }
      const score = F.P[i].y + bend * 20 + crowd * 6;           // 낮고 곧고 한적한 곳
      if (score < bs) { bs = score; best = i; }
    }
    if (best < 0) best = 0;
    // 데크·바깥 기둥을 어느 쪽에 둘지: 다른 트랙이 더 멀리 있는 쪽
    const sideScore = sd => { let m = 1e9; for (const j of [wrap(best - K), wrap(best + K)]) { const c = F.P[j].clone().addScaledVector(F.B[j], 2.1 * sd); for (let k = 0; k < F.n; k += 3) { const di = Math.abs(k - best); if (Math.min(di, F.n - di) < 30) continue; m = Math.min(m, F.P[k].distanceTo(c)); } } return m; };
    const side = sideScore(1) >= sideScore(-1) ? 1 : -1;
    // 승강장 구조물은 두지 않음 (시야·외관) — best 는 열차 출발점(uStation) 계산에만 씀
    void side;
  }
  return { group: g, curve, F };
}

function makeStation(F, best, wrap, color, hang, side = 1) {
  // 지붕·기둥 없는 낮은 탑승 발판만 (시야를 가리지 않게)
  const p = F.P[best], t = F.T[best];
  const st = new THREE.Group();
  const deckG = new THREE.Group(); deckG.scale.x = side; st.add(deckG);
  const deckY = hang ? Math.max(0.3, p.y - 2.2) : Math.max(0.3, p.y - 0.3);
  deckG.add(mesh(new THREE.BoxGeometry(1.6, deckY, 5), '#e9e4d8', 1.35, deckY / 2, 0));
  { const _q = mesh(new THREE.BoxGeometry(1.6, 0.06, 5), '#ffd23f', 1.35, deckY + 0.03, 0); _q.position.x = 0.62; deckG.add(_q); }
  st.position.set(p.x, 0, p.z);
  st.rotation.y = Math.atan2(t.x, t.z);
  return st;
}

function loopPts(cx, cy, r, z0, z1, n = 12) {
  const out = [];
  for (let i = 1; i < n; i++) {
    const a = i / n * Math.PI * 2;
    out.push([cx + r * Math.sin(a), cy - r * Math.cos(a), z0 + (z1 - z0) * i / n]);
  }
  return out;
}

function switchback(rows, top, zR) {
  const pts = [[-6.5, 1.2, 7.2], [-7, top * 0.45, 3.5], [-7, top, -2], [-6.6, top, -zR]];
  let prevX = -6.6, side = -1, y = top;
  for (let i = 0; i < rows; i++) {
    const x = -4.6 + i * (10 / (rows - 1));
    y = top - 0.3 - i * ((top - 2.4) / rows);
    pts.push([(prevX + x) / 2, y + 0.1, side * (zR + 0.9)]);
    pts.push([x, y, side * zR * 0.6]);
    pts.push([x, y - 0.2, -side * zR * 0.6]);
    side = -side; prevX = x;
  }
  pts.push([prevX + 1.1, y - 0.3, side * (zR + 0.9)]);
  pts.push([7.2, 1.4, side > 0 ? zR + 1.6 : 0]);
  pts.push([4, 1.2, 8]);
  pts.push([-2, 1.2, 8]);
  return pts;
}

        body.add(mesh(RBOX(1.3, 0.5, 0.14, 0.05), c, 0, -0.5, -0.4, glossy));
        for (const x of [-0.3, 0.3]) {
          rider(body, x, -1.05, -0.15, k0 + (x > 0), false);
          const h = mesh(new THREE.TorusGeometry(0.16, 0.035, 8, 16, Math.PI), dark, x, -0.95, -0.02); h.rotation.x = -Math.PI / 2; h.rotation.z = Math.PI; h.userData.rider = false; body.add(h);
        }
      } else {
        for (const x of [-0.3, 0.3]) rider(body, x, -0.98, 0, k0 + (x > 0), true);
      }
      break;
    }
    case 'spin': {
      const tub = new THREE.Group();
      tub.add(mesh(new THREE.CylinderGeometry(0.82, 0.72, 0.4, 24), c, 0, 0.35, 0, glossy));
      { const _q = mesh(new THREE.TorusGeometry(0.78, 0.07, 8, 28), trim, 0, 0.56, 0); _q.rotation.x = Math.PI / 2; tub.add(_q); }
      tub.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.5, 12), dark, 0, 0.5, 0));
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + 0.4, x = Math.cos(a) * 0.45, z = Math.sin(a) * 0.45;
        { const _q = mesh(RBOX(0.3, 0.45, 0.08, 0.03), dark, x * 1.35, 0.75, z * 1.35); _q.rotation.y = -a; tub.add(_q); }
        void k0;
      }
      body.add(tub);
      wheels(body, 0.02, -0.3, 0.3, 0.4, 0.09);
      car.userData.spin = tub;
      break;
    }
    case 'mouse': {
      body.add(mesh(RBOX(0.95, 0.45, 1.15, 0.12), c, 0, 0.4, 0, glossy));
      body.add(mesh(new THREE.SphereGeometry(0.34, 16, 12), c, 0, 0.5, 0.62, glossy));
      body.add(mesh(new THREE.SphereGeometry(0.09, 10, 8), dark, 0, 0.55, 0.95));
      for (const x of [-0.3, 0.3]) {
        { const _q = mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.06, 18), trim, x, 0.95, 0.35); _q.rotation.x = Math.PI / 2; body.add(_q); }
        { const _q = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.07, 18), '#ffffff', x, 0.95, 0.36); _q.rotation.x = Math.PI / 2; body.add(_q); }
        body.add(mesh(new THREE.SphereGeometry(0.07, 10, 8), '#ffffff', x * 0.6, 0.68, 0.84));
        body.add(mesh(new THREE.SphereGeometry(0.035, 8, 6), dark, x * 0.6, 0.68, 0.9));
      }
      const tail = mesh(new THREE.TorusGeometry(0.25, 0.03, 6, 14, Math.PI * 1.3), trim, 0, 0.55, -0.7);
      tail.rotation.y = Math.PI / 2; body.add(tail);
      wheels(body, 0.12, -0.35, 0.35, 0.42, 0.11);
      seats(body, 0.9, 0.55, -0.15, c, dark, true);
      rider(body, -0.2, 0.82, -0.18, k0, false); rider(body, 0.2, 0.82, -0.18, k0 + 1, false);
      break;
    }
    case 'mine': {
      body.add(mesh(RBOX(0.98, 0.5, 1.1, 0.06), c, 0, 0.42, 0));
      body.add(mesh(new THREE.BoxGeometry(1.04, 0.07, 1.16), trim, 0, 0.7, 0));
      for (const x of [-0.5, 0.5]) for (const z of [-0.3, 0.3]) body.add(mesh(new THREE.BoxGeometry(0.05, 0.5, 0.08), '#5a3a1a', x, 0.42, z)); // 쇠띠
      wheels(body, 0.18, -0.36, 0.36, 0.46, 0.14);
      if (lead) {
        body.add(mesh(new THREE.CylinderGeometry(0.12, 0.17, 0.55, 10), '#3b3b3b', 0, 1.0, 0.35));
        body.add(mesh(new THREE.CylinderGeometry(0.2, 0.12, 0.12, 10), '#3b3b3b', 0, 1.3, 0.35));
        body.add(mesh(new THREE.SphereGeometry(0.1, 10, 8), '#fff2b0', 0, 0.55, 0.58, { emissive: '#ffd56a', emissiveIntensity: 1 }));
      }
      seats(body, 0.92, 0.5, -0.1, '#5a3a1a', '#4a2f17', false);
      rider(body, -0.22, 0.85, -0.15, k0, false); rider(body, 0.22, 0.85, -0.15, k0 + 1, false);
      break;
    }
    default: { // sit · sleek · classic · kid
      const small = t.kind === 'kid';
      const s = small ? 0.85 : 1;
      body.add(mesh(RBOX(1.0 * s, 0.34, 1.2, 0.1), c, 0, 0.32, 0, glossy));
      body.add(mesh(RBOX(1.03 * s, 0.05, 1.22, 0.02), trim, 0, 0.5, 0));
      body.add(mesh(RBOX(1.0 * s, 0.5, 0.14, 0.05), c, 0, 0.72, -0.52, glossy));
      body.add(mesh(new THREE.BoxGeometry(1.0 * s + 0.02, 0.08, 0.16), trim, 0, 0.95, -0.52));
      if (t.kind === 'classic') for (let k = 0; k < 3; k++) body.add(mesh(new THREE.BoxGeometry(1.02, 0.03, 0.1), trim, 0, 0.3 + k * 0.1, 0.56));
      wheels(body, 0.12, -0.4, 0.4, 0.5 * s + 0.02, 0.11);
      if (lead) {
        const nose = mesh(RBOX(0.86 * s, 0.26, 0.7, 0.12), t.kind === 'sleek' ? trim : c, 0, 0.3, 0.85, glossy);
        nose.rotation.x = 0.15; body.add(nose);
        for (const x of [-0.25, 0.25]) body.add(mesh(new THREE.SphereGeometry(0.07, 10, 8), '#fff8d0', x * s, 0.36, 1.18, { emissive: '#ffe9a0', emissiveIntensity: 0.9 }));
      }
      seats(body, s, 0.45, -0.12, c, dark, true);
      for (const x of [-0.22, 0.22]) rider(body, x * s, 0.78, -0.14, k0 + (x > 0), false);
    }
  }
  return car;
}

function makeTrain(track, t) {
  const g = new THREE.Group();
  const cars = [];
  for (let k = 0; k < t.cars; k++) { const c = makeCar(t, k); g.add(c); cars.push(c); }
  let ymax = -1e9, ymin = 1e9;
  for (const p of track.F.P) { ymax = Math.max(ymax, p.y); ymin = Math.min(ymin, p.y); }
  return { group: g, cars, F: track.F, L: track.curve.getLength(), conf: t, u: rnd(), dir: 1, closed: track.curve.closed, ymax, ymin, v: 0, kmh: 0 };
}

const METRICS = [
  { key: 'speed', label: '속도', sub: '중앙값', unit: 'km/h', get: s => s.speed.v, n: s => s.speed.n, worst: '가장 느리다', best: '가장 빠르다', say: v => `속도 중앙값 ${fmt(v, 1)}km/h` },
  { key: 'height', label: '높이', sub: '중앙값', unit: 'm', get: s => s.height.v, n: s => s.height.n, worst: '가장 낮다', best: '가장 높다', say: v => `높이 중앙값 ${fmt(v, 1)}m` },
  { key: 'inv', label: '뒤집힘', sub: '역회전 있는 비율', unit: '%', get: s => s.inv_share, n: s => s.count, worst: '거의 뒤집히지 않는다', best: '뒤집히는 코스터 비율이 가장 높다', say: v => `역회전이 있는 코스터 ${fmt(v, 1)}%` },
  { key: 'count', label: '개수', sub: '데이터 속 코스터', unit: '개', get: s => s.count, n: s => s.count, worst: '가장 드물다', best: '가장 흔하다', say: v => `코스터 ${fmt(v)}개` },
];
for (const m of METRICS) {
  const vals = zones.map(z => m.get(z.stats) ?? 0);
  m.max = Math.max(...vals); m.min = Math.min(...vals);
  m.rank = v => 1 + vals.filter(x => x > v).length;
}
const BAR_H = 9;

function makeChart(z) {
  const g = new THREE.Group();
  const floor = mesh(new THREE.BoxGeometry(13.5, 0.25, 6), '#ffffff', 8, 0.12, 3.2);
  g.add(floor);
  METRICS.forEach((m, k) => {
    const v = m.get(z.stats) ?? 0;
    const h = Math.max(0.06, BAR_H * v / m.max);
    const x = 3.2 + k * 3.2;
    const bar = mesh(new THREE.BoxGeometry(2, h, 2), z.color, x, 0.25 + h / 2, 3.2);
    const rank = m.rank(v);
    bar.userData.tip = `<b>${m.label} (${m.sub})</b><br>${fmt(v, 1)} ${m.unit} · 10개 존 중 ${rank}위<br><small>분모 n = ${fmt(m.n(z.stats))}개 · 막대 높이는 10개 존 최댓값(${fmt(m.max, 1)}${m.unit}) 기준</small>`;
    g.add(bar);
    const val = label([`${fmt(v, m.key === 'count' ? 0 : 1)}${m.unit === '개' ? '개' : m.unit === '%' ? '%' : ' ' + m.unit}`], 1.15, { size: 46 });
    val.position.set(x, 0.25 + h + 0.9, 3.2);
    g.add(val);
    const lb = label([m.label, m.sub], 1.25, { size: 40, bg: 'rgba(255,253,245,.9)' });
    lb.position.set(x, 0.9, 5.5);
    g.add(lb);
  });

  // 개장 연대 미니 그래프 (뒤쪽)
  const decs = [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
  const counts = decs.map(d => (z.decades.find(x => x.decade === d) || { n: 0 }).n);
  const cmax = Math.max(1, ...counts);
  const peak = counts.indexOf(cmax);
  g.add(mesh(new THREE.BoxGeometry(13.5, 0.2, 2.6), '#f4f6fa', 8, 0.1, -3.6));
  decs.forEach((d, k) => {
    const h = Math.max(0.05, 5 * counts[k] / cmax);
    const b = mesh(new THREE.BoxGeometry(1.2, h, 1.2), k === peak ? z.color : '#b9c3d3', 2.6 + k * 1.55, 0.2 + h / 2, -3.6);
    b.userData.tip = `<b>${d}년대 개장</b><br>${counts[k]}개${k === peak ? ' · 이 존에서 가장 많이 생긴 연대' : ''}<br><small>이 존 안에서의 상대 높이 (최대 ${cmax}개)</small>`;
    g.add(b);
  });
  const dl = label(['개장 연대 1950 → 2020s', `가장 많이 생긴 때: ${decs[peak]}년대`], 1.3, { size: 38 });
  dl.position.set(8, 6.6, -3.6);
  g.add(dl);
  return g;
}

  z.plat = plat;
  // 테두리

  g.add(edge);

  const sp = new THREE.Mesh(new THREE.PlaneGeometry(5, 10), pathMat);
  sp.rotation.x = -Math.PI / 2; sp.position.set(-1, 0.42, 16); sp.receiveShadow = true; g.add(sp);
  // 흰 울타리
  const picket = new Inst(BOX, '#ffffff'), rail = new Inst(BOX, '#ffffff');
  const ring = [[-16, -13, 16, -13], [16, -13, 16, 13], [-16, 13, -16, -13], [-16, 13, -4, 13], [2, 13, 16, 13]];
  for (const [x1, z1, x2, z2] of ring) {
    const len = Math.hypot(x2 - x1, z2 - z1), n = Math.round(len / 1.1), ang = Math.atan2(z2 - z1, x2 - x1);
    for (let i = 0; i <= n; i++) picket.add(x1 + (x2 - x1) * i / n, 0.9, z1 + (z2 - z1) * i / n, 0.12, 1.0, 0.12, -ang);
    rail.add((x1 + x2) / 2, 1.2, (z1 + z2) / 2, len, 0.08, 0.06, -ang);
    rail.add((x1 + x2) / 2, 0.75, (z1 + z2) / 2, len, 0.08, 0.06, -ang);
  }
  g.add(picket.build(), rail.build());

  const model = MODELS[z.key](z.color);
  model.group.position.set(-7.5, 0.4, -1); model.group.userData.part = '모형';
  z.coll = (COLL || []).map(c => ({ name: c.name, r: c.r, pts: c.pts.map((v, i) => v + [-7.5, 0.4, -1][i % 3]) }));
  COLL = null;
  g.add(model.group);
  if (model.train) {
    const t = makeTrain(model, model.train);
    t.group.position.copy(model.group.position);
    t.speed = z.stats.speed.v || 50;
    t.kmhMax = z.stats.speed_max || (t.speed * 1.4);
    t.zone = z.i;
    { let best = 0, by = 1e9; for (let i = 0; i < t.F.n; i++) if (t.F.P[i].y < by) { by = t.F.P[i].y; best = i; } t.uStation = best / t.F.n; }
    g.add(t.group);
    trains.push(t);
  }

  const chart = makeChart(z);
  chart.position.set(1.2, 0.4, 0); chart.userData.part = '차트';
  { const bars = { name: '차트 막대', r: 1.2, pts: [] }; chart.traverse(o => { if (o.userData.tip && o.geometry) { const h = o.geometry.parameters.height || 1; for (let y = 0; y < h; y += 0.8) bars.pts.push(o.position.x + 1.2, 0.4 + o.position.y - h / 2 + y, o.position.z); } }); z.coll.push(bars); }
  g.add(chart);

  // 이름 간판
  const sign = new THREE.Group();
  sign.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 4.2, 6), '#ffffff', -3.4, 2.1, 0));
  sign.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 4.2, 6), '#ffffff', 3.4, 2.1, 0));
  const sb = board([z.name, z.en], 2.6, { size: 56, color: z.color === '#ffb020' || z.color === '#9ad94a' ? '#1d2433' : z.color });
  sb.position.set(0, 3.6, 0.12);
  sign.add(sb);
  sign.position.set(-8, 0.4, 11.6); sign.userData.part = '간판';
  g.add(sign);
  z.coll.push({ name: '간판', r: 1.5, pts: [-8, 3.8, 11.7] });

  scene.add(g);
  z.group = g;
  pickables.push(g);
});

const GLOW = color => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 1.6, roughness: 0.3 });

function lathe(profile, color, extra, segs = 12) {
  const pts = profile.map(([r, y]) => new THREE.Vector2(r, y));
  const m = mesh(new THREE.LatheGeometry(pts, segs), color, 0, 0, 0, extra);

}

function makeGuest(d) {
  const g = new THREE.Group();
  const s = d.h, skin = SKIN[d.skin], child = s < 0.7, f = d.body === 'f';
  const legH = 0.8 * s, torsoH = 0.58 * s, R = 0.19 * s;
  const headR = (child ? 0.2 : 0.165) * (0.65 + 0.35 * s);
  const longSleeve = ['jacket', 'hoodie', 'coat', 'uniform'].includes(d.outfit);
  const topM = d.outfit === 'jacket' ? LEATHER : CLOTH;
  const neon = d.neon ? GLOW(d.neon) : null;
  const addG = (m, parent = g) => { parent.add(m); return m; };

  /* ---- 다리: 엉덩이 관절 → 허벅지 → 무릎 관절 → 정강이 → 신발 ---- */
  const hips = [], knees = [];
  const legCol = d.bottom === 'pants' || d.bottom === 'leggings' ? d.botC : skin;

  for (const x of [-1, 1]) {

    addG(mesh(CAP(0.075 * s, shinL - 0.15 * s), legCol, 0, -shinL / 2, 0.01, legM), knee);
    // 신발: 발등 + 발끝 + 밑창 (네온 밑창)
    const shoe = new THREE.Group(); shoe.position.set(0, -shinL, 0.02 * s);
    addG(mesh(RBOX(0.19 * s, 0.12 * s, 0.3 * s, 0.05), d.shoes, 0, -0.02 * s, 0.04 * s, LEATHER), shoe);

    addG(new THREE.Mesh(RBOX(0.2 * s, 0.035 * s, 0.34 * s, 0.01), neon && d.outfit !== 'dress' ? neon : mat('#2a2f3a')), shoe).position.set(0, -0.085 * s, 0.06 * s);

  }

    ? [[R * 1.0, 0], [R * 1.05, 0.12], [R * 0.82, 0.42], [R * 1.0, 0.68], [R * 1.08, 0.85], [R * 0.95, 0.96], [R * 0.4, 1.0]]
    : [[R * 0.95, 0], [R * 0.97, 0.12], [R * 0.92, 0.42], [R * 1.05, 0.7], [R * 1.22, 0.86], [R * 1.1, 0.96], [R * 0.45, 1.0]];

  // 재킷 · 후디 · 코트 · 유니폼: 몸통 위에 겉옷 셸

    const bottomY = d.outfit === 'coat' ? -0.55 * s : 0.08 * torsoH;
    const shell = lathe([[R * (d.outfit === 'coat' ? 1.35 : 1.08), bottomY], [R * 1.06, torsoH * 0.3], [R * 1.08, torsoH * 0.68], [R * 1.22, torsoH * 0.88], [R * 1.12, torsoH * 0.98], [R * 0.5, torsoH * 1.02]], d.top, topM);
    shell.scale.z = 0.76; shell.position.y = legH; g.add(shell);
    // 지퍼 · 단추 줄

    collar.rotation.set(-Math.PI / 2, 0, Math.PI * 0.8); collar.scale.z = 0.8; g.add(collar);

  addG(mesh(new THREE.CylinderGeometry(0.055 * s, 0.07 * s, 0.12 * s, 8), skin, 0, legH + torsoH + 0.04 * s, 0, SKIN_M)); // 목

  /* ---- 팔: 어깨 관절 → 위팔 → 팔꿈치 관절 → 아래팔 → 손 ---- */

    addG(mesh(CAP(0.07 * s, upL - 0.14 * s), longSleeve || d.outfit === 'tee' ? d.top : skin, 0, -upL / 2, 0, longSleeve || d.outfit === 'tee' ? topM : SKIN_M), sh);
    const el = new THREE.Group(); el.position.set(0, -upL, 0);

    addG(mesh(CAP(0.058 * s, foreL - 0.12 * s), longSleeve ? d.top : skin, 0, -foreL / 2, 0, longSleeve ? topM : SKIN_M), el);

  const irisC = ['#3b2414', '#2d6a4f', '#1d4ed8', '#6b4a2b'][(d.skin + (d.h * 100 | 0)) % 4];
  for (const x of [-1, 1]) {

    addG(mesh(new THREE.SphereGeometry(headR * 0.02, 4, 3), '#ffffff', x * eyeX + headR * 0.03, eyeY + headR * 0.04, eyeZ + headR * 0.17));

    const brow = mesh(RBOX(headR * 0.32, headR * 0.05, headR * 0.05, 0.01), d.hair === 'gray' ? '#9a9a9a' : d.hairC === '#7c5cff' || d.hairC === '#20c4e8' ? '#2b1b12' : d.hairC, x * eyeX, eyeY + headR * 0.3, eyeZ + headR * 0.02, HAIR_M); brow.rotation.z = -x * 0.15; g.add(brow);
    addG(mesh(new THREE.SphereGeometry(headR * 0.17, 7, 5), skin, x * headR * 0.97, headY - headR * 0.02, 0, SKIN_M)).scale.set(0.5, 1, 0.8); // 귀
    if (f || child) addG(mesh(new THREE.SphereGeometry(headR * 0.15, 6, 4), '#ffb8b0', x * headR * 0.55, headY - headR * 0.2, headR * 0.72, { roughness: 0.8 })).scale.z = 0.4;
  }
  const nose = mesh(CAP(headR * 0.07, headR * 0.12), skin, 0, headY - headR * 0.08, headR * 0.98, SKIN_M); nose.rotation.x = Math.PI / 2 - 0.3; g.add(nose);
  const mouth = mesh(new THREE.TorusGeometry(headR * 0.17, headR * 0.03, 5, 10, Math.PI), '#9e4b53', 0, headY - headR * 0.38, headR * 0.86); mouth.rotation.z = Math.PI; mouth.scale.z = 0.5; g.add(mouth);

  switch (d.hair) {
    case 'short': g.add(cap(0.52)); addG(mesh(RBOX(headR * 1.9, headR * 0.6, headR * 0.5, 0.05), hc, 0, headY + headR * 0.1, -headR * 0.75, HAIR_M)); for (const x of [-1, 1]) addG(mesh(RBOX(headR * 0.2, headR * 0.5, headR * 0.4, 0.03), hc, x * headR * 0.95, headY + headR * 0.05, headR * 0.25, HAIR_M)); break;
    case 'gray': g.add(cap(0.5)); break;
    case 'undercut': addG(mesh(new THREE.SphereGeometry(headR * 0.98, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.5), '#2a2a2a', 0, headY + headR * 0.1, 0, HAIR_M)); { const top = mesh(RBOX(headR * 1.3, headR * 0.5, headR * 1.5, 0.08), hc, 0, headY + headR * 1.05, headR * 0.1, HAIR_M); top.rotation.x = -0.15; g.add(top); } break;
    case 'bob': g.add(cap(0.6)); { const sh = lathe([[headR * 1.05, 0], [headR * 1.15, -headR * 0.9], [headR * 1.1, -headR * 1.1], [0, -headR * 1.1]], hc, HAIR_M); sh.position.set(0, headY + headR * 0.2, -headR * 0.15); sh.scale.z = 0.9; g.add(sh); } addG(mesh(RBOX(headR * 1.2, headR * 0.3, headR * 0.4, 0.05), hc, 0, headY + headR * 0.55, headR * 0.85, HAIR_M)).rotation.x = 0.3; break; // 앞머리
    case 'long': g.add(cap(0.6)); { const sh = lathe([[headR * 1.02, 0], [headR * 1.12, -headR * 1.2], [headR * 1.25, -headR * 2.4], [headR * 1.0, -headR * 2.5], [0, -headR * 2.5]], hc, HAIR_M); sh.position.set(0, headY + headR * 0.2, -headR * 0.25); sh.scale.z = 0.75; g.add(sh); } break;
    case 'pony': g.add(cap(0.62)); { const tail = mesh(CAP(headR * 0.26, headR * 1.3), hc, 0, headY - headR * 0.35, -headR * 1.1, HAIR_M); tail.rotation.x = 0.35; g.add(tail); addG(mesh(new THREE.TorusGeometry(headR * 0.28, headR * 0.06, 5, 10), d.neon || '#ff5d5d', 0, headY + headR * 0.5, -headR * 1.0)); } break;
    case 'bun': g.add(cap(0.6)); addG(mesh(new THREE.SphereGeometry(headR * 0.42, 9, 7), hc, 0, headY + headR * 1.0, -headR * 0.55, HAIR_M)); break;
    case 'mohawk': addG(mesh(new THREE.SphereGeometry(headR * 0.98, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.5), '#1a1a1a', 0, headY + headR * 0.1, 0, HAIR_M)); for (let k = 0; k < 7; k++) { const sp = mesh(RBOX(headR * 0.22, headR * (0.7 + Math.sin(k / 6 * Math.PI) * 0.6), headR * 0.26, 0.03), hc, 0, headY + headR * 1.15, headR * (0.75 - k * 0.25), HAIR_M); sp.rotation.x = -0.25 + k * 0.08; g.add(sp); } break;

    case 'cap': addG(mesh(new THREE.SphereGeometry(headR * 0.95, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.5), '#2b1b12', 0, headY + headR * 0.1, 0, HAIR_M));
      addG(mesh(new THREE.SphereGeometry(headR * 1.12, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.5), hc, 0, headY + headR * 0.15, 0, CLOTH));
      { const brim = mesh(RBOX(headR * 1.5, headR * 0.1, headR * 1.0, 0.02), hc, 0, headY + headR * 0.32, headR * 1.05, CLOTH); brim.rotation.x = -0.15; g.add(brim); } break;
  }

    case 'headphones': { const band = mesh(new THREE.TorusGeometry(headR * 1.12, headR * 0.09, 5, 10, Math.PI), '#1d2433', 0, headY + headR * 0.12, 0, LEATHER); band.rotation.z = Math.PI; band.rotation.x = 0; g.add(band);
      for (const x of [-1, 1]) { const cup = mesh(new THREE.CylinderGeometry(headR * 0.32, headR * 0.32, headR * 0.22, 8), '#1d2433', x * headR * 1.12, headY + headR * 0.05, 0, LEATHER); cup.rotation.z = Math.PI / 2; g.add(cup); if (neon) { const ring = new THREE.Mesh(new THREE.TorusGeometry(headR * 0.26, 0.012, 5, 10), neon); ring.position.set(x * headR * 1.24, headY + headR * 0.05, 0); ring.rotation.y = Math.PI / 2; g.add(ring); } } break; }
    case 'mask': addG(mesh(RBOX(headR * 1.2, headR * 0.7, headR * 0.6, 0.1), '#1d2433', 0, headY - headR * 0.35, headR * 0.6, CLOTH)); if (neon) addG(new THREE.Mesh(RBOX(headR * 0.9, headR * 0.05, 0.02, 0.01), neon)).position.set(0, headY - headR * 0.35, headR * 0.92); break;
    case 'glasses': for (const x of [-1, 1]) addG(mesh(new THREE.TorusGeometry(headR * 0.24, 0.012, 5, 10), '#1d2433', x * eyeX, eyeY, eyeZ + headR * 0.1)); addG(mesh(new THREE.BoxGeometry(headR * 0.25, 0.012, 0.012), '#1d2433', 0, eyeY, eyeZ + headR * 0.1)); for (const x of [-1, 1]) addG(mesh(new THREE.BoxGeometry(0.012, 0.012, headR * 0.9), '#1d2433', x * headR * 0.85, eyeY, headR * 0.45)); break;

  const fixed = [false, false];
  switch (d.acc) {
    case 'balloon': { hold(1, -0.5, -0.15, -0.6); fixed[1] = true; const hp = handW(1);
      addG(mesh(new THREE.CylinderGeometry(0.008, 0.008, 1.5 * s, 3), '#ffffff', hp.x, hp.y + 0.75 * s, hp.z));

      addG(mesh(new THREE.ConeGeometry(0.045 * s, 0.09 * s, 6), d.accC, hp.x, hp.y + 1.28 * s, hp.z)); break; }
    case 'icecream': { hold(1, -1.3, -0.1, -1.2); fixed[1] = true; const hp = handW(1);
      const cone = mesh(new THREE.ConeGeometry(0.085 * s, 0.3 * s, 12), '#d9a441', hp.x, hp.y + 0.1 * s, hp.z + 0.06 * s); cone.rotation.x = Math.PI; g.add(cone);
      addG(mesh(new THREE.SphereGeometry(0.1 * s, 14, 10), '#ff8fb0', hp.x, hp.y + 0.3 * s, hp.z + 0.06 * s, { roughness: 0.7 }));
      addG(mesh(new THREE.SphereGeometry(0.085 * s, 14, 10), '#fff5d6', hp.x, hp.y + 0.45 * s, hp.z + 0.06 * s, { roughness: 0.7 })); break; }
    case 'phone': { hold(1, -1.25, -0.3, -1.5); fixed[1] = true; const hp = handW(1);
      const ph = new THREE.Mesh(RBOX(0.14 * s, 0.26 * s, 0.025, 0.02), mat('#1d2433', LEATHER)); ph.position.set(hp.x - 0.02, hp.y + 0.08 * s, hp.z + 0.05); ph.rotation.x = -0.5; g.add(ph);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.12 * s, 0.23 * s), GLOW(d.neon || '#7fd3ff')); scr.position.set(hp.x - 0.02, hp.y + 0.08 * s + 0.007, hp.z + 0.05 + 0.014); scr.rotation.x = -0.5; g.add(scr); break; }
    case 'backpack': { addG(mesh(RBOX(R * 2.0, torsoH * 0.8, R * 1.1, 0.08), d.accC, 0, legH + torsoH * 0.5, -R * 1.2, CLOTH));
      addG(mesh(RBOX(R * 1.5, torsoH * 0.35, R * 0.5, 0.06), d.accC, 0, legH + torsoH * 0.3, -R * 1.9, CLOTH));
      for (const x of [-1, 1]) addG(mesh(RBOX(0.07 * s, torsoH * 0.7, 0.03, 0.01), '#1d2433', x * R * 0.55, legH + torsoH * 0.6, R * 0.8, CLOTH));
      if (neon) { const st = new THREE.Mesh(RBOX(R * 1.6, 0.03, 0.02, 0.01), neon); st.position.set(0, legH + torsoH * 0.5, -R * 1.78); g.add(st); } break; }
    case 'bag': { hold(1, 0.15, -0.1, -0.1); addG(mesh(RBOX(R * 1.5, torsoH * 0.4, R * 0.6, 0.06), d.accC, R * 2.2, legH + 0.12 * s, 0.05, LEATHER));
      addG(mesh(new THREE.TorusGeometry(R * 0.5, 0.012, 5, 10, Math.PI), d.accC, R * 2.2, legH + 0.12 * s + torsoH * 0.2, 0.05, LEATHER)); break; }
    case 'camera': { hold(0, -1.2, 0.35, -1.6); hold(1, -1.2, -0.35, -1.6); fixed[0] = fixed[1] = true;
      addG(mesh(RBOX(0.3 * s, 0.19 * s, 0.13 * s, 0.03), '#1d2433', 0, legH + torsoH * 0.9, R * 2.0, LEATHER));
      addG(mesh(new THREE.CylinderGeometry(0.06 * s, 0.07 * s, 0.1 * s, 8), '#3b4252', 0, legH + torsoH * 0.9, R * 2.35, { metalness: 0.6, roughness: 0.3 })).rotation.x = Math.PI / 2; break; }
    case 'cane': { hold(1, 0.4, -0.05, -0.3); fixed[1] = true; const hp = handW(1);
      addG(mesh(new THREE.CylinderGeometry(0.02, 0.028, hp.y, 8), '#4a3220', hp.x, hp.y / 2, hp.z + 0.1 * s, LEATHER));
      addG(mesh(new THREE.TorusGeometry(0.06, 0.02, 5, 10, Math.PI), '#4a3220', hp.x, hp.y, hp.z + 0.1 * s, LEATHER)); break; }
  }
  if (!fixed[0]) elbows[0].rotation.x = -0.3;
  if (!fixed[1]) elbows[1].rotation.x = -0.3;

  g.userData = { hips, knees, shoulders, elbows, fixed, torso: head, design: d.name, elder: d.acc === 'cane', s };
  return g;
}

/* 걷기: 허벅지 흔들기 + 앞으로 나갈 때 무릎 굽힘 + 팔 반대 흔들기 + 몸 들썩임 */
function animateGuest(g, ph) {
  const u = g.userData;
  for (let i = 0; i < 2; i++) {
    const p = ph + i * Math.PI;
    u.hips[i].rotation.x = Math.sin(p) * 0.55;
    u.knees[i].rotation.x = Math.max(0, Math.sin(p - 1.0)) * 0.95 * (u.elder ? 0.5 : 1);
    if (!u.fixed[i]) { u.shoulders[i].rotation.x = -Math.sin(p) * 0.45; u.elbows[i].rotation.x = -0.3 - Math.max(0, -Math.sin(p)) * 0.4; }
  }
  g.position.y = Math.abs(Math.cos(ph)) * 0.035 * u.s;
  g.rotation.z = Math.sin(ph) * 0.025;
}

/* 메시 병합: 관절(Group)마다 직계 메시들을 정점색 하나의 지오메트리로 합쳐 드로우콜을 줄여요.
   애니메이션은 Group 회전으로만 하니 그대로 동작. 발광(네온·화면)·반투명(바이저)은 따로 둠. */
const MAT_GUEST = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.72, metalness: 0, sheen: 0.3, sheenRoughness: 0.8 });
const MAT_GUEST_GLOSS = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.35, metalness: 0.05, clearcoat: 0.7, clearcoatRoughness: 0.3 });
function compactGuest(g) {
  const groups = []; g.traverse(o => { if (o.isGroup) groups.push(o); });
  let before = 0, after = 0;
  for (const grp of groups) {
    const kids = grp.children.filter(c => c.isMesh);
    before += kids.length;
    const buckets = { std: [], gloss: [] }, keep = [];
    for (const m of kids) {
      const mat = m.material;
      const glow = mat.emissive && mat.emissiveIntensity > 0 && (mat.emissive.r + mat.emissive.g + mat.emissive.b) > 0;
      if (glow || mat.transparent || !mat.color) { keep.push(m); continue; }
      m.updateMatrix();
      let geo = m.geometry.clone().applyMatrix4(m.matrix);
      if (geo.index) geo = geo.toNonIndexed();
      for (const name of Object.keys(geo.attributes)) if (name !== 'position' && name !== 'normal' && name !== 'uv') geo.deleteAttribute(name);
      const n = geo.attributes.position.count, col = new Float32Array(n * 3), c = mat.color;
      for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      ((mat.clearcoat > 0 || mat.roughness < 0.3) ? buckets.gloss : buckets.std).push(geo);
    }
    for (const m of kids) if (!keep.includes(m)) grp.remove(m);
    for (const [k, list] of Object.entries(buckets)) if (list.length) {
      const mm = new THREE.Mesh(mergeGeometries(list, false), k === 'gloss' ? MAT_GUEST_GLOSS : MAT_GUEST);
      mm.castShadow = true; mm.receiveShadow = true; grp.add(mm); after++;
    }
    after += keep.length;
  }
  g.userData.meshes = { before, after };
  g.userData.parts = []; g.traverse(o => { if (o.isMesh) g.userData.parts.push(o); });
  return g;
}

const guests = [];
for (let k = 0; k < 44; k++) {
  const d = GUEST_DESIGNS[k % GUEST_DESIGNS.length];
  const p = compactGuest(makeGuest(d));
  p.position.set(-90 + rnd() * 190, 0, -3.5 + rnd() * 7);
  const base = p.userData.elder ? 0.5 : d.h < 0.7 ? 1.5 : 1.1;
  p.userData.v = base * (0.8 + rnd() * 0.5) * (rnd() < 0.5 ? -1 : 1);
  p.userData.ph = rnd() * 6;
  scene.add(p); guests.push(p);
}

/* ---------- 소리: 군중 웅성거림 · 간헐적 비명 · 탑승 중 바람 (전부 Web Audio로 합성) ---------- */
const SFX = { on: false, ctx: null, master: null, crowd: null, wind: null, screams: [], lastScream: -1, nextScream: 0, loading: null };
function makeNoise(ctx, sec = 2) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; return src;
}
async function loadBuf(ctx, url) {
  const res = await fetch(url); const ab = await res.arrayBuffer();
  return await ctx.decodeAudioData(ab);
}
function sfxInit() {
  if (SFX.ctx) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  SFX.ctx = ctx;
  SFX.master = ctx.createGain(); SFX.master.gain.value = 0; SFX.master.connect(ctx.destination);
  // 바람: 노이즈 → 로우패스, 탑승 중 속도에 따라
  const w = makeNoise(ctx, 2);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
  const wg = ctx.createGain(); wg.gain.value = 0;
  w.connect(lp); lp.connect(wg); wg.connect(SFX.master); w.start();
  SFX.wind = { gain: wg, filter: lp };
  // 체인 리프트: 낮은 모터 웅웅 + 래칫 덜그럭 (sfxUpdate 에서 주기적으로 클릭)
  const motor = ctx.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 46;
  const motor2 = ctx.createOscillator(); motor2.type = 'square'; motor2.frequency.value = 92.5;
  const mlp = ctx.createBiquadFilter(); mlp.type = 'lowpass'; mlp.frequency.value = 260;
  const mg = ctx.createGain(); mg.gain.value = 0;
  motor.connect(mlp); motor2.connect(mlp); mlp.connect(mg); mg.connect(SFX.master); motor.start(); motor2.start();
  const clackBuf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate), cd = clackBuf.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / cd.length, 3);
  SFX.chain = { gain: mg, clackBuf, next: 0 };
  // 배경음(북적거림): asset/ambience.mp3 를 계속 루프 · 비명 7종 미리 읽기
  SFX.loading = (async () => {
    const amb = await loadBuf(ctx, 'asset/ambience.mp3');
    const src = ctx.createBufferSource(); src.buffer = amb; src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0.9;
    src.connect(g); g.connect(SFX.master); src.start();
    SFX.crowd = g;
    SFX.screams = await Promise.all([1, 2, 3, 4, 5, 6, 7].map(n => loadBuf(ctx, `asset/Scream ${n}.wav`).catch(() => null)));
    SFX.screams = SFX.screams.filter(Boolean);
  })().catch(e => console.warn('소리 파일을 못 읽었어요', e));
}
/* 비명: 7종 중 직전과 다른 하나를 랜덤으로, 작게 (놀라지 않도록 0.18~0.26) */
function scream() {
  const ctx = SFX.ctx; if (!ctx || !SFX.on || !SFX.screams.length) return;
  let i = Math.floor(Math.random() * SFX.screams.length);
  if (SFX.screams.length > 1 && i === SFX.lastScream) i = (i + 1) % SFX.screams.length;
  SFX.lastScream = i;
  const src = ctx.createBufferSource(); src.buffer = SFX.screams[i];
  src.playbackRate.value = 0.94 + Math.random() * 0.12;
  const g = ctx.createGain(); const t0 = ctx.currentTime, vol = 0.18 + Math.random() * 0.08;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.12);              // 서서히 커져서 놀라지 않게
  g.gain.setValueAtTime(vol, t0 + src.buffer.duration - 0.25); g.gain.linearRampToValueAtTime(0, t0 + src.buffer.duration);
  src.connect(g); g.connect(SFX.master); src.start(t0);
}
function setSound(on) {
  SFX.on = on;
  $('sound').textContent = on ? '🔊 소리' : '🔈 소리';
  $('sound').title = on ? '지금 소리 켜짐 — 클릭하면 끔' : '지금 소리 꺼짐 — 클릭하면 켬';
